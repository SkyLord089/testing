name: Build & Publish DualMoE.exe Release

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-gates:
    name: Byte-Identity & Streaming Safety Gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build & test dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build
          pip install gguf numpy

      - name: Clone & patch llama.cpp
        run: |
          git init /tmp/llama-cpp
          git -C /tmp/llama-cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama-cpp fetch --depth 1 origin 31953bcf74ba489a8bbb0c936c5fcf24fcf9485c
          git -C /tmp/llama-cpp checkout FETCH_HEAD
          git -C /tmp/llama-cpp apply "${GITHUB_WORKSPACE}/dualmoe/patches/0001-dualmoe-parallel-seam.patch"

      - name: Configure, build & run DualMoE byte-identity tests
        run: |
          cmake -S dualmoe -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_SOURCE_DIR=/tmp/llama-cpp \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_OPENMP=OFF
          cmake --build build --target dualmoe-tests -j $(nproc)
          python3 dualmoe/scripts/make_tiny_moe_gguf.py build/tiny_moe.gguf
          ./build/dualmoe-tests build/tiny_moe.gguf

  windows-exe:
    name: Native-window DualMoE.exe (MSVC x64 + Vulkan + AVX2 + WebView2)
    runs-on: windows-2025
    env:
      VULKAN_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # Prepare the compiler env (cl.exe / MSVC headers) for CMake + Ninja.
          cmd /c "call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" >nul 2>&1"
          cmd /c "call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" >nul && set" |
            ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { Add-Content $env:GITHUB_ENV "$($Matches[1])=$($Matches[2])" } }

          curl.exe -sSL -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait -NoNewWindow
          if (-not (Test-Path "C:\VulkanSDK\${env:VULKAN_VERSION}\Bin")) {
            throw "Vulkan SDK installation directory not found!"
          }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\Bin"

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y

      - name: Prepare MSVC environment (cl.exe for CMake + Ninja)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ toolset not found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          Write-Host "Using $vcvars"
          cmd /c "call `"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Add-Content $env:GITHUB_ENV "$($Matches[1])=$($Matches[2])" }
          }

      - name: Clone & patch llama.cpp
        shell: bash
        run: |
          git init C:/llama-cpp
          git -C C:/llama-cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C C:/llama-cpp fetch --depth 1 origin 31953bcf74ba489a8bbb0c936c5fcf24fcf9485c
          git -C C:/llama-cpp checkout FETCH_HEAD
          git -C C:/llama-cpp apply --ignore-whitespace "${GITHUB_WORKSPACE}/dualmoe/patches/0001-dualmoe-parallel-seam.patch"

      - name: Build Standalone DualMoE.exe (native window + Vulkan + AVX2/FMA)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cmake -S dualmoe -B build-win -G "Ninja Multi-Config" `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/dualmoe/cmake/x64-windows-msvc.cmake `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DDUALMOE_DESKTOP_WINDOW=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLAMA_SOURCE_DIR=C:/llama-cpp `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLAMA_OPENSSL=OFF `
            -DGGML_VULKAN=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX2=ON `
            -DGGML_FMA=ON `
            -DGGML_F16C=ON `
            -DGGML_OPENMP=OFF `
            -DDUALMOE_BUILD_TESTS=OFF 2>&1 | Tee-Object -FilePath cfg.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content cfg.log -Tail 25 | ForEach-Object { Write-Host "::error::CFG: $_" }
            exit 1
          }
          cmake --build build-win --config Release --target DualMoE -j ${env:NUMBER_OF_PROCESSORS} 2>&1 | Tee-Object -FilePath bld.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path bld.log -Pattern "error:|fatal error:|LNK\d+|FAILED:" | Select-Object -Last 20 | ForEach-Object { Write-Host "::error::BLD: $($_.Line)" }
            Get-Content bld.log -Tail 15 | ForEach-Object { Write-Host "::error::TAIL: $_" }
            exit 1
          }

      - name: Verify & Stage Single Standalone DualMoE.exe (native window)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Path build-win -Recurse -Filter "DualMoE.exe" -File |
                 Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::Native window DualMoE.exe was not found in build-win! (WebView2 desktop target failed to build)"
            Get-ChildItem -Path build-win -Recurse -Filter "*.exe" -File | ForEach-Object { Write-Host "  found: $($_.FullName)" }
            exit 1
          }
          Copy-Item $exe.FullName -Destination "dist/DualMoE.exe" -Force
          # Window subsystem EXE: --help prints to console when attached, and an
          # unattached GUI launch must not block CI, so only verify it is a PE32+ GUI.
          $bytes = [System.IO.File]::ReadAllBytes("dist/DualMoE.exe")
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOff + 0x5C)
          Write-Host "PE subsystem = $subsystem (2=GUI window, 3=console)"
          if ($subsystem -ne 2) {
            Write-Host "::error::DualMoE.exe is not a GUI-subsystem binary (got $subsystem) — window build missing"
            exit 1
          }
          Get-Item "dist/DualMoE.exe" | Format-List Name, Length

      - name: Upload Standalone DualMoE.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualMoE-exe
          path: dist/DualMoE.exe
          if-no-files-found: error

  publish-release:
    name: Publish Single-EXE Release (dualmoe-v0.5.0)
    needs: [verify-gates, windows-exe]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download DualMoE.exe
        uses: actions/download-artifact@v4
        with:
          name: DualMoE-exe
          path: dist

      - name: Create or Update GitHub Release dualmoe-v0.5.0 (EXE Only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dualmoe-v0.5.0"
          TITLE="DualMoE v0.5.0 — Нативное окно + Benchmark (автоподбор параметров)"
          ls -lh dist/DualMoE.exe
          NOTES=$(cat << 'EOF'
          ## DualMoE v0.5.0 — нативное окно приложения + Benchmark с автоподбором параметров

          Один самодостаточный файл **`DualMoE.exe`** для Windows 10/11 x64 (**Ryzen 7 5700X AVX2/FMA + Radeon RX 580 8 ГБ Vulkan + 16 ГБ DDR4 + механический HDD**). Запуск двойным кликом — отдельное окно DualMoE, без браузера и адресной строки.

          ### Что нового в v0.5.0
          1. **Вкладка `Benchmark` — автоподбор параметров под ваше железо**:
             - **Полный замер**: движок по очереди загружает модель с разными комбинациями (потоки CPU, стартовая доля `CPU ∥ GPU`, размер банка горячих экспертов в VRAM, микробатч), генерирует одинаковый greedy-текст и замеряет реальные `tok/s`, `TTFT` и число чтений HDD. Победитель по взвешенному score (скорость + попадания в VRAM − диск) остаётся загруженным — можно сразу продолжать диалог.
             - **Быстрый расчёт**: мгновенная оценка без перезагрузки модели (GGUF-метаданные + свободные VRAM/RAM → KV-кэш с учётом SWA и разделяемых слоёв, банк экспертов, арена DDR4, микробатч, потоки) с человеческим объяснением каждого решения.
             - Дублирующие кандидаты автоматически сворачиваются (каждый замер = одна перезагрузка модели), прогресс, журнал и таблица результатов — живьём.
          2. **Полностью новый интерфейс** в тёмной редакционной эстетике: узкая левая панель с сеансами/ботами/моделями, вкладки `Hermes · Benchmark · Диагностика` сверху, крупный титул HERMES на стартовом экране, правый рельс с моделью, слайдерами гибридного движка, живой телеметрией `VRAM ⇄ RAM` и подсказкой для LearnHarness.
          3. **Нативное окно (Edge WebView2)** из v0.4.1 сохранено: своя иконка в панели задач, системный диалог выбора `.gguf`, мгновенная остановка движка при закрытии окна, мягкий откат в браузер, если WebView2 Runtime отсутствует.

          ### Запуск
          1. Скачайте **`DualMoE.exe`** в любую папку.
          2. Двойной клик → окно DualMoE → **«Файл модели…»** → выбрать `.gguf` → **«Загрузить»**.
          3. Откройте вкладку **Benchmark** → **«Запустить»** → дождитесь победителя → **«Применить»**.

          Модель можно задать сразу: `DualMoE.exe --model D:\Models\gemma-4-26b-a4b.gguf`.
          EOF
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/DualMoE.exe --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}"
          else
            gh release create "${TAG}" dist/DualMoE.exe \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes "${NOTES}"
          fi
