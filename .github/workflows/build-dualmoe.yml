name: Build & Publish DualMoE.exe Release

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-gates:
    name: Byte-Identity & Streaming Safety Gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build & test dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build
          pip install gguf numpy

      - name: Clone & patch llama.cpp
        run: |
          git init /tmp/llama-cpp
          git -C /tmp/llama-cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama-cpp fetch --depth 1 origin 31953bcf74ba489a8bbb0c936c5fcf24fcf9485c
          git -C /tmp/llama-cpp checkout FETCH_HEAD
          git -C /tmp/llama-cpp apply "${GITHUB_WORKSPACE}/dualmoe/patches/0001-dualmoe-parallel-seam.patch"

      - name: Configure, build & run DualMoE byte-identity tests
        run: |
          cmake -S dualmoe -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_SOURCE_DIR=/tmp/llama-cpp \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_OPENMP=OFF
          cmake --build build --target dualmoe-tests -j $(nproc)
          python3 dualmoe/scripts/make_tiny_moe_gguf.py build/tiny_moe.gguf
          ./build/dualmoe-tests build/tiny_moe.gguf

  windows-exe:
    name: Standalone DualMoE.exe (Windows x64 + Vulkan + AVX2)
    runs-on: windows-2025
    env:
      VULKAN_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -sSL -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait -NoNewWindow
          if (-not (Test-Path "C:\VulkanSDK\${env:VULKAN_VERSION}\Bin")) {
            throw "Vulkan SDK installation directory not found!"
          }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\Bin"

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y

      - name: Clone & patch llama.cpp
        shell: bash
        run: |
          git init C:/llama-cpp
          git -C C:/llama-cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C C:/llama-cpp fetch --depth 1 origin 31953bcf74ba489a8bbb0c936c5fcf24fcf9485c
          git -C C:/llama-cpp checkout FETCH_HEAD
          git -C C:/llama-cpp apply --ignore-whitespace "${GITHUB_WORKSPACE}/dualmoe/patches/0001-dualmoe-parallel-seam.patch"

      - name: Build Standalone DualMoE.exe (Vulkan + AVX2/FMA)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cmake -S dualmoe -B build-win -G "Ninja Multi-Config" `
            -DCMAKE_TOOLCHAIN_FILE=C:/llama-cpp/cmake/x64-windows-llvm.cmake `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLAMA_SOURCE_DIR=C:/llama-cpp `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLAMA_OPENSSL=OFF `
            -DGGML_VULKAN=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX2=ON `
            -DGGML_FMA=ON `
            -DGGML_F16C=ON `
            -DGGML_OPENMP=OFF `
            -DDUALMOE_BUILD_TESTS=OFF 2>&1 | Tee-Object -FilePath cfg.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content cfg.log -Tail 25 | ForEach-Object { Write-Host "::error::CFG: $_" }
            exit 1
          }
          cmake --build build-win --config Release --target dualmoe-server -j ${env:NUMBER_OF_PROCESSORS} 2>&1 | Tee-Object -FilePath bld.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path bld.log -Pattern "error:|fatal error:|LNK\d+|FAILED:" | Select-Object -Last 20 | ForEach-Object { Write-Host "::error::BLD: $($_.Line)" }
            Get-Content bld.log -Tail 15 | ForEach-Object { Write-Host "::error::TAIL: $_" }
            exit 1
          }

      - name: Verify & Stage Single Standalone DualMoE.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Path build-win -Recurse -Filter "DualMoE.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::DualMoE.exe was not found in build-win!"
            exit 1
          }
          Copy-Item $exe.FullName -Destination "dist/DualMoE.exe" -Force
          & "dist/DualMoE.exe" --help
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::DualMoE.exe --help smoke check failed with exit code $LASTEXITCODE"
            exit 1
          }
          Get-Item "dist/DualMoE.exe" | Format-List Name, Length

      - name: Upload Standalone DualMoE.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualMoE-exe
          path: dist/DualMoE.exe
          if-no-files-found: error

  publish-release:
    name: Publish Single-EXE Release (dualmoe-v0.4.0)
    needs: [verify-gates, windows-exe]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download DualMoE.exe
        uses: actions/download-artifact@v4
        with:
          name: DualMoE-exe
          path: dist

      - name: Create or Update GitHub Release dualmoe-v0.4.0 (EXE Only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dualmoe-v0.4.0"
          TITLE="DualMoE v0.4.0 — Standalone EXE (Gemma 4 Fix: Multi-Proj Disjoint Swap + Jinja2 + SWA KV + DRY)"
          ls -lh dist/DualMoE.exe
          NOTES=$(cat << 'EOF'
          ## DualMoE v0.4.0 — Исправление галлюцинаций Gemma 4 26B-A4B + Оптимизации под RX 580 8 ГБ & Ryzen 7 5700X

          Один самодостаточный исполняемый файл **`DualMoE.exe`** для Windows 10/11 x64 (**Ryzen 7 5700X AVX2/FMA + Radeon RX 580 8 ГБ Vulkan + 16 ГБ DDR4 + механический HDD**) — без архивов, установщиков и `.bat`-скриптов.

          ### Исправленные критические ошибки (причины искажения слов, утечки `<|channel>thought` и циклов в Gemma 4 26B-A4B)
          1. **Исправлено обнуление проекций `ffn_down_exps` / `ffn_up_exps` при вытеснении эксперта из VRAM в ОЗУ (`Disjoint VRAM ⊕ RAM`)**:
             - В v0.3.0 при вытеснении эксперта `VRAM → RAM` первая проекция (`ip=0`, `ffn_gate_exps`) помечала как `Ready` сразу **все три** проекции слоя, из-за чего `ffn_down_exps` (`ip=1`) и `ffn_up_exps` (`ip=2`) пропускали копирование из видеопамяти RX 580 и исполнялись на CPU с **нулевыми страницами (`0.0f`)**, ломая логиты и порождая искажённые слова (`библиотеджей`, `пута`, `фикней`).
             - Теперь готовность и чтение из VRAM отслеживаются **строго по каждой проекции отдельно**, а спасение слота (`rescue_expert`) сохраняет признак `in_vram` без потерь состояния.
          2. **Полный движок шаблонов Jinja2 (`llama-common`) для Gemma 4, Qwen 3 и DeepSeek + защита от двойного `<bos>`**:
             - Вместо устаревшего `llama_chat_apply_template` (который на Gemma 4 возвращал `-1`, подставлял чужой `ChatML <|im_start|>` и дублировал `<bos><bos>`, вызывая галлюцинации из претрейна и утечку сырых тегов `<|channel>thought\n<channel|>`) интегрирован полноценный парсер Jinja2 с родными маркерами `<|turn>`, `<|think|>`, `<turn|>`.
             - Сохраняются специальные управляющие токены (`special=true`), автоматически вырезаются прошлые блоки рассуждений из истории диалога (экономия тысяч токенов KV-кэша!), а в русском веб-интерфейсе добавлены **сворачиваемый блок «Показать ход рассуждений»** и живой переключатель **«Мышление: ВКЛ / ВЫКЛ»** без перезагрузки модели.
          3. **Строгая фильтрация 3D-тензоров маршрутизируемых экспертов**:
             - Одномерные коэффициенты масштабирования `ffn_down_exps.scale` в Gemma 4 больше не попадают под фильтр `_exps.` и остаются в быстрой постоянной памяти.

          ### Новые оптимизации скорости и памяти под RX 580 8 ГБ + Ryzen 7 5700X + 16 ГБ DDR4
          - **Точный расчёт SWA + Shared-KV кэша Gemma 4 (`+900–1 000 МБ` свободной VRAM под экспертов)**: учёт скользящего окна (`SWA = 1024` на 25 из 30 слоёв) и 10 разделяемых KV-слоёв освобождает около **1 ГБ видеопамяти RX 580** под дополнительные горячие слоты экспертов!
          - **Совместимость с Flash Attention на Polaris (`KV-V = f16`)**: исключает превышение лимита `32 КБ LDS` на RX 580 при `head_dim = 512` у полноразмерных слоёв Gemma 4.
          - **Устранение лишней синхронизации Vulkan + отложенный на 1 слой `MEM_DECOMMIT`**: убраны простои конвейера GPU/PCIe при обмене горячих экспертов и сглажен начальный вес прогрева `CRF` (`1.0f`).
          - **Ускоренный сэмплер на словаре 262 144 токенов + анти-цикл `DRY`**: фильтрация `top-k` перенесена в начало цепочки до штрафов, а фразовый сэмплер `DRY` блокирует зацикливания строк кода (`import matplotlib as mplt...`).

          ### Запуск
          Скачайте **`DualMoE.exe`** в любую папку и запустите двойным кликом (`http://127.0.0.1:8090`, OpenAI API для LearnHarness: `http://127.0.0.1:8090/v1`).
          EOF
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/DualMoE.exe --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}"
          else
            gh release create "${TAG}" dist/DualMoE.exe \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes "${NOTES}"
          fi
