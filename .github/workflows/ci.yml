name: CI
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust app
        run: |
          set +e
          cargo test --all-targets > cargo-test.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then sed -E 's/\x1B\[[0-9;]*[mK]//g' cargo-test.log | grep -iE 'error\[|error:|failed to|could not|unresolved|mismatched|no method|trait bound|expected .*found' | tail -n 12 | sed 's/^/::error::/'; fi
          exit "$result"
      - run: cargo build --release
