name: CI
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust app
        run: |
          set +e
          cargo test --all-targets > cargo-test.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then tail -n 15 cargo-test.log | sed 's/^/::error::/'; fi
          exit "$result"
      - run: cargo build --release
