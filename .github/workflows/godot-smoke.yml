name: Godot smoke test

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import and validate resources
        run: godot --headless --editor --path . --quit

      - name: Run end-to-end smoke test
        run: |
          set -o pipefail
          timeout 150s godot --headless --path . --script res://tests/smoke_test.gd --fixed-fps 90 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' smoke.log; then
            echo 'Godot reported an error in the smoke log.'
            exit 1
          fi
          test "$(grep -c '^PASS:' smoke.log)" -ge 21

      - name: Publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Godot smoke test failed. Diagnostic log:'
            echo '```text'
            head -n 110 smoke.log
            echo '--- Errors and checks ---'
            grep -E 'SCRIPT ERROR|ERROR:|FAIL:|PASS:|SMOKE' smoke.log | head -n 180
            echo '```'
          } > /tmp/godot-comment.md
          jq -Rs '{body: .}' /tmp/godot-comment.md > /tmp/godot-comment.json
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" --input /tmp/godot-comment.json
