[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouseconfig"
version = "0.1.0"
description = "Настройка беспроводных мышей Logitech через HID++ (аналог OpenMouse/Solaar)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["hidapi>=0.14"]

[project.scripts]
mouseconfig = "mouseconfig.cli:main"

[tool.setuptools]
packages = ["mouseconfig"]

[tool.setuptools.package-data]
mouseconfig = ["profiles/*.json"]
