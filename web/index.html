<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101510">
  <title>Strafe Lab — ASCII-комната</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="game" class="game" tabindex="0" role="application" aria-label="ASCII-комната от первого лица. WASD — движение, Shift — шаг, R — сброс, F или левая кнопка мыши — вспышка выстрела.">
    <canvas id="screen" width="960" height="720" aria-hidden="true"></canvas>
    <p id="error" class="error" role="alert" hidden></p>
    <noscript><p class="error">Для отображения комнаты включите JavaScript.</p></noscript>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
